<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NİRVANA İLAÇLAMA | Kayseri & Sivas 163 Komagene Şube Operasyon Haritası</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        #map { width: 100%; height: 100%; z-index: 10; }
        .user-location-pulse {
            width: 20px; height: 20px; background-color: #2563eb;
            border: 3px solid #ffffff; border-radius: 50%;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.8); position: relative;
        }
        .user-location-pulse::after {
            content: ''; position: absolute; top: -10px; left: -10px;
            width: 34px; height: 34px; border-radius: 50%;
            background-color: rgba(37, 99, 235, 0.35); animation: pulseRing 2s infinite ease-out;
        }
        @keyframes pulseRing {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        .custom-pin {
            display: flex; align-items: center; justify-content: center;
            border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
            border: 2.5px solid #ffffff; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease;
        }
        .custom-pin:hover { transform: rotate(-45deg) scale(1.12); }
        .custom-pin i { transform: rotate(45deg); }
        .leaflet-popup-content-wrapper { border-radius: 14px; padding: 0; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.18); }
        .leaflet-popup-content { margin: 0; min-width: 260px; max-width: 310px; }
        .leaflet-popup-close-button { color: #ffffff !important; top: 8px !important; right: 8px !important; font-size: 18px !important; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen flex flex-col">

    <!-- ÜST NAVBAR -->
    <header class="bg-slate-900 text-white px-4 py-3 shadow-lg z-30 flex flex-wrap items-center justify-between gap-3 border-b border-emerald-600/40">
        <div class="flex items-center gap-3">
            <button id="toggleSidebarBtn" class="lg:hidden p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 transition" title="Şube Listesini Aç/Kapat">
                <i class="ph ph-list text-2xl"></i>
            </button>
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center shadow-md shadow-emerald-900/50 border border-emerald-400/30">
                    <i class="ph-fill ph-shield-check text-2xl text-white"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-base sm:text-lg tracking-wide text-white leading-none">NİRVANA İLAÇLAMA</h1>
                        <span class="hidden sm:inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">163 Şube Tam Liste</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-0.5">Kayseri & Sivas Komagene Operasyon Haritası</p>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <button id="gpsToggleBtn" onclick="toggleGpsTracking()" class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-blue-600 hover:bg-blue-500 text-white shadow-md transition active:scale-95">
                <i id="gpsIcon" class="ph-bold ph-navigation-arrow text-base"></i>
                <span id="gpsBtnText">Konumumu Takip Et</span>
            </button>
            <button id="centerUserBtn" onclick="centerOnUser()" class="hidden items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 hover:bg-slate-700 text-blue-400 border border-blue-500/30 transition">
                <i class="ph-bold ph-crosshair text-base"></i>
                <span class="hidden md:inline">Konumuma Git</span>
            </button>
            <button onclick="exportBranchesJSON()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md transition active:scale-95" title="JSON Yedek İndir">
                <i class="ph-bold ph-download-simple text-base"></i>
                <span class="hidden sm:inline">JSON Yedek</span>
            </button>
            <button onclick="openBranchModal()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-md shadow-emerald-950/50 transition active:scale-95">
                <i class="ph-bold ph-plus-circle text-base"></i>
                <span>Şube Ekle</span>
            </button>
        </div>
    </header>

    <!-- ANA İÇERİK -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- SOL KENAR ÇUBUĞU -->
        <aside id="sidebar" class="w-full sm:w-[400px] lg:w-[420px] bg-white border-r border-slate-200 flex flex-col h-full z-20 absolute lg:relative transition-transform duration-300 transform translate-x-0 shadow-2xl lg:shadow-none">
            
            <!-- İSTATİSTİK KARTLARI -->
            <div class="grid grid-cols-4 gap-2 p-3 bg-slate-50 border-b border-slate-200">
                <div class="bg-white p-2 rounded-xl border border-slate-200 text-center shadow-sm">
                    <div id="statTotal" class="text-lg font-extrabold text-slate-800">0</div>
                    <div class="text-[10px] font-semibold text-slate-500 uppercase">Toplam</div>
                </div>
                <div class="bg-white p-2 rounded-xl border border-slate-200 text-center shadow-sm">
                    <div id="statKayseri" class="text-lg font-extrabold text-emerald-600">0</div>
                    <div class="text-[10px] font-semibold text-slate-500 uppercase">Kayseri</div>
                </div>
                <div class="bg-white p-2 rounded-xl border border-slate-200 text-center shadow-sm">
                    <div id="statSivas" class="text-lg font-extrabold text-indigo-600">0</div>
                    <div class="text-[10px] font-semibold text-slate-500 uppercase">Sivas</div>
                </div>
                <div class="bg-white p-2 rounded-xl border border-slate-200 text-center shadow-sm">
                    <div id="statDone" class="text-lg font-extrabold text-teal-600">0</div>
                    <div class="text-[10px] font-semibold text-slate-500 uppercase">İlaçlandı</div>
                </div>
            </div>

            <!-- FİLTRE VE ARAMA -->
            <div class="p-3 bg-white border-b border-slate-200 space-y-2.5">
                <div class="relative">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
                    <input type="text" id="searchInput" oninput="renderBranches()" placeholder="Şube adı, ilçe veya mahalle ara..." class="w-full pl-9 pr-8 py-2 text-sm bg-slate-100 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <i class="ph-bold ph-x text-sm"></i>
                    </button>
                </div>

                <div class="flex gap-1.5 bg-slate-100 p-1 rounded-xl">
                    <button onclick="setCityFilter('ALL')" id="cityTabALL" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-slate-800 shadow-sm transition">Tümü</button>
                    <button onclick="setCityFilter('Kayseri')" id="cityTabKayseri" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition">Kayseri</button>
                    <button onclick="setCityFilter('Sivas')" id="cityTabSivas" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition">Sivas</button>
                </div>

                <div class="flex items-center gap-2">
                    <select id="statusFilter" onchange="renderBranches()" class="flex-1 text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="ALL">Tüm İlaçlama Durumları</option>
                        <option value="İlaçlama Yapıldı">✅ İlaçlama Yapıldı</option>
                        <option value="Planlandı">📅 Planlandı</option>
                        <option value="Bekliyor">⏳ Bekliyor</option>
                    </select>

                    <select id="sortOrder" onchange="renderBranches()" class="flex-1 text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="default">Varsayılan Sıra</option>
                        <option value="distance">📍 En Yakın Konuma Göre</option>
                        <option value="name">🔤 İsme Göre (A-Z)</option>
                    </select>
                </div>
            </div>

            <!-- ŞUBE LİSTESİ -->
            <div id="branchListContainer" class="flex-1 overflow-y-auto p-3 space-y-2.5 bg-slate-50/70"></div>

            <!-- ALT BİLGİ -->
            <div class="p-2.5 bg-white border-t border-slate-200 flex items-center justify-between text-[11px] text-slate-500">
                <span class="font-semibold text-slate-700">Nirvana İlaçlama v2.5</span>
                <button onclick="confirmResetData()" class="text-slate-400 hover:text-rose-600 font-medium transition flex items-center gap-1" title="Sıfırla">
                    <i class="ph ph-arrow-counter-clockwise"></i> Sıfırla
                </button>
            </div>
        </aside>

        <!-- SAĞ HARİTA -->
        <main class="flex-1 relative h-full w-full">
            <div id="map"></div>
            
            <div class="absolute top-4 right-4 z-20 flex flex-col gap-2">
                <div class="bg-white/95 backdrop-blur p-1.5 rounded-2xl shadow-lg border border-slate-200 flex flex-col gap-1">
                    <button onclick="focusCity('ALL')" class="px-3 py-1.5 text-xs font-bold rounded-xl hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 transition text-left flex items-center gap-1.5">
                        <i class="ph-bold ph-globe-hemisphere-east text-emerald-600"></i> Tüm Bölge
                    </button>
                    <button onclick="focusCity('Kayseri')" class="px-3 py-1.5 text-xs font-bold rounded-xl hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 transition text-left flex items-center gap-1.5">
                        <i class="ph-bold ph-map-pin text-emerald-600"></i> Kayseri (133 Şube)
                    </button>
                    <button onclick="focusCity('Sivas')" class="px-3 py-1.5 text-xs font-bold rounded-xl hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 transition text-left flex items-center gap-1.5">
                        <i class="ph-bold ph-map-pin text-indigo-600"></i> Sivas (30 Şube)
                    </button>
                </div>
            </div>

            <!-- LEJANT -->
            <div class="hidden sm:flex absolute bottom-6 right-4 z-20 bg-white/95 backdrop-blur px-3.5 py-2 rounded-2xl shadow-lg border border-slate-200 items-center gap-4 text-xs font-medium text-slate-700">
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-600 inline-block"></span><span>İlaçlama Yapıldı</span></div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span><span>Planlandı</span></div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-600 inline-block"></span><span>Bekliyor</span></div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-blue-600 inline-block animate-pulse"></span><span>Konumunuz</span></div>
            </div>
        </main>
    </div>

    <!-- ŞUBE EKLE / DÜZENLE MODALI -->
    <div id="branchModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 overflow-hidden my-auto">
            <div class="bg-slate-900 text-white px-5 py-4 flex items-center justify-between">
                <h2 id="modalTitle" class="font-bold text-base">Yeni Komagene Şubesi Ekle</h2>
                <button onclick="closeBranchModal()" class="text-slate-400 hover:text-white p-1 rounded-lg transition"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            <form id="branchForm" onsubmit="saveBranchForm(event)" class="p-5 space-y-4">
                <input type="hidden" id="branchId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Şube Adı *</label>
                        <input type="text" id="branchName" required placeholder="Örn: Komagene Talas Meydan" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">İl *</label>
                        <select id="branchCity" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white"><option value="Kayseri">Kayseri</option><option value="Sivas">Sivas</option></select>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">İlçe *</label>
                        <input type="text" id="branchDistrict" required placeholder="Örn: Melikgazi" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">İlaçlama Durumu *</label>
                        <select id="branchStatus" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white">
                            <option value="Bekliyor">⏳ Bekliyor</option>
                            <option value="Planlandı">📅 Planlandı</option>
                            <option value="İlaçlama Yapıldı">✅ İlaçlama Yapıldı</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Açık Adres *</label>
                    <textarea id="branchAddress" rows="2" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-slate-500 mb-0.5">Enlem (Lat) *</label>
                        <input type="number" step="any" id="branchLat" required class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-500 mb-0.5">Boylam (Lng) *</label>
                        <input type="number" step="any" id="branchLng" required class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg">
                    </div>
                </div>
                <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-200">
                    <button type="button" onclick="closeBranchModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">İptal</button>
                    <button type="submit" class="px-5 py-2 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl shadow-md">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ONAY MODALI -->
    <div id="confirmModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-5 text-center space-y-4">
            <h3 id="confirmTitle" class="font-bold text-lg text-slate-800">Emin misiniz?</h3>
            <p id="confirmMessage" class="text-sm text-slate-600">Bu işlem geri alınamaz.</p>
            <div class="flex gap-2 pt-2">
                <button onclick="closeConfirmModal()" class="flex-1 py-2.5 text-sm font-semibold bg-slate-100 rounded-xl">Vazgeç</button>
                <button id="confirmActionBtn" class="flex-1 py-2.5 text-sm font-bold text-white bg-rose-600 rounded-xl">Onayla</button>
            </div>
        </div>
    </div>

    <!-- BİLDİRİM TOAST -->
    <div id="toastContainer" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

        let branches = [];
        let currentCityFilter = 'ALL';
        let map = null;
        let markersLayer = null;
        let markerMap = {};
        
        let isTrackingGps = false;
        let watchId = null;
        let userCoords = null;
        let userMarker = null;
        let userAccuracyCircle = null;

        window.onload = function() {
            loadBranchesFromStorage();
            initMap();
            renderBranches();
            document.getElementById('toggleSidebarBtn').addEventListener('click', toggleSidebar);
        };

        function loadBranchesFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    branches = JSON.parse(saved);
                } else {
                    branches = JSON.parse(JSON.stringify(MASTER_BRANCHES));
                    saveBranchesToStorage();
                }
            } catch (e) {
                branches = JSON.parse(JSON.stringify(MASTER_BRANCHES));
            }
        }

        function saveBranchesToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(branches));
            } catch (e) {}
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([39.22, 36.25], 8);
            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO | NİRVANA İLAÇLAMA',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
        }

        function getStatusStyle(status) {
            switch (status) {
                case 'İlaçlama Yapıldı':
                    return { hex: '#059669', badgeBg: 'bg-emerald-100 text-emerald-800 border-emerald-200', icon: 'ph-check-circle' };
                case 'Planlandı':
                    return { hex: '#d97706', badgeBg: 'bg-amber-100 text-amber-800 border-amber-200', icon: 'ph-calendar-check' };
                default:
                    return { hex: '#e11d48', badgeBg: 'bg-rose-100 text-rose-800 border-rose-200', icon: 'ph-clock' };
            }
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function renderBranches() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;
            const sortOrder = document.getElementById('sortOrder').value;

            const clearBtn = document.getElementById('clearSearchBtn');
            if (searchQuery.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            document.getElementById('statTotal').textContent = branches.length;
            document.getElementById('statKayseri').textContent = branches.filter(b => b.city === 'Kayseri').length;
            document.getElementById('statSivas').textContent = branches.filter(b => b.city === 'Sivas').length;
            document.getElementById('statDone').textContent = branches.filter(b => b.status === 'İlaçlama Yapıldı').length;

            let filtered = branches.filter(branch => {
                const matchCity = currentCityFilter === 'ALL' || branch.city === currentCityFilter;
                const matchStatus = statusFilter === 'ALL' || branch.status === statusFilter;
                const matchSearch = !searchQuery || 
                    branch.name.toLowerCase().includes(searchQuery) ||
                    branch.district.toLowerCase().includes(searchQuery) ||
                    branch.address.toLowerCase().includes(searchQuery);
                return matchCity && matchStatus && matchSearch;
            });

            filtered = filtered.map(b => {
                let dist = userCoords ? calculateDistanceKm(userCoords.lat, userCoords.lng, b.lat, b.lng) : null;
                return { ...b, distance: dist };
            });

            if (sortOrder === 'distance' && userCoords) {
                filtered.sort((a, b) => (a.distance ?? 9999) - (b.distance ?? 9999));
            } else if (sortOrder === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name, 'tr'));
            }

            markersLayer.clearLayers();
            markerMap = {};

            const listContainer = document.getElementById('branchListContainer');
            listContainer.innerHTML = '';

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-10 px-4 bg-white rounded-2xl border border-dashed border-slate-300"><p class="text-sm font-bold text-slate-600">Şube bulunamadı</p></div>`;
                return;
            }

            filtered.forEach(branch => {
                const style = getStatusStyle(branch.status);
                const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${branch.lat},${branch.lng}`;
                const distanceBadge = branch.distance !== null ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">${branch.distance < 1 ? (branch.distance * 1000).toFixed(0) + ' m' : branch.distance.toFixed(1) + ' km'}</span>` : '';

                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-2xl border border-slate-200 hover:border-emerald-500 shadow-sm transition cursor-pointer group";
                card.onclick = (e) => {
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    focusBranchOnMap(branch.id);
                };

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <div class="flex items-center gap-1.5 flex-wrap mb-1">
                                <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md ${branch.city === 'Kayseri' ? 'bg-slate-800 text-white' : 'bg-indigo-900 text-white'}">${branch.city} / ${branch.district}</span>
                                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${style.badgeBg}"><i class="ph-fill ${style.icon}"></i> ${branch.status}</span>
                                ${distanceBadge}
                            </div>
                            <h3 class="font-bold text-sm text-slate-800 group-hover:text-emerald-700 transition leading-snug">${branch.name}</h3>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="openBranchModal('${branch.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 rounded-lg"><i class="ph-bold ph-pencil-simple text-base"></i></button>
                            <button onclick="confirmDeleteBranch('${branch.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg"><i class="ph-bold ph-trash text-base"></i></button>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 mt-1.5 flex items-start gap-1.5"><i class="ph-fill ph-map-pin text-slate-400 shrink-0 mt-0.5"></i><span>${branch.address}</span></p>
                    <div class="flex items-center gap-2 mt-3 pt-2.5 border-t border-slate-100">
                        <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 shadow-sm transition">
                            <i class="ph-bold ph-compass text-sm"></i><span>Yol Tarifi Al</span>
                        </a>
                    </div>
                `;
                listContainer.appendChild(card);

                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="custom-pin" style="background-color: ${style.hex}; width: 34px; height: 34px;"><i class="ph-fill ph-storefront text-white text-base"></i></div>`,
                    iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -34]
                });

                const marker = L.marker([branch.lat, branch.lng], { icon: customIcon });
                marker.bindPopup(`
                    <div class="font-sans">
                        <div class="px-3.5 py-2.5 text-white" style="background-color: ${style.hex};">
                            <div class="text-[10px] font-bold uppercase opacity-90">${branch.city} • ${branch.district}</div>
                            <div class="font-extrabold text-sm mt-0.5">${branch.name}</div>
                        </div>
                        <div class="p-3.5 bg-white space-y-2.5">
                            <p class="text-xs text-slate-600">${branch.address}</p>
                            <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer" class="w-full bg-blue-600 hover:bg-blue-500 !text-white font-bold text-xs py-2 rounded-xl flex items-center justify-center gap-1.5 shadow">Google Maps Yol Tarifi</a>
                        </div>
                    </div>
                `);
                marker.addTo(markersLayer);
                markerMap[branch.id] = marker;
            });
        }

        function focusBranchOnMap(branchId) {
            const branch = branches.find(b => b.id === branchId);
            const marker = markerMap[branchId];
            if (branch && marker) {
                map.flyTo([branch.lat, branch.lng], 16, { duration: 1.2 });
                setTimeout(() => marker.openPopup(), 400);
                if (window.innerWidth < 1024) document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        function setCityFilter(city) {
            currentCityFilter = city;
            ['ALL', 'Kayseri', 'Sivas'].forEach(c => {
                const btn = document.getElementById('cityTab' + c);
                btn.className = c === city ? "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-emerald-700 shadow-sm transition" : "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-600 transition";
            });
            renderBranches();
            focusCity(city);
        }

        function focusCity(city) {
            if (city === 'Kayseri') map.flyTo([38.7225, 35.4875], 12, { duration: 1 });
            else if (city === 'Sivas') map.flyTo([39.7477, 37.0179], 13, { duration: 1 });
            else map.flyTo([39.22, 36.25], 8, { duration: 1 });
        }

        function clearSearch() { document.getElementById('searchInput').value = ''; renderBranches(); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }

        function exportBranchesJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(branches, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "nirvana_ilaclama_163_sube_yedek.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast("163 şube yedeği indirildi!", "success");
        }

        function openBranchModal(id = null) {
            const form = document.getElementById('branchForm');
            form.reset();
            document.getElementById('branchId').value = '';
            if (id) {
                const b = branches.find(item => item.id === id);
                if (!b) return;
                document.getElementById('modalTitle').textContent = 'Şube Düzenle';
                document.getElementById('branchId').value = b.id;
                document.getElementById('branchName').value = b.name;
                document.getElementById('branchCity').value = b.city;
                document.getElementById('branchDistrict').value = b.district;
                document.getElementById('branchStatus').value = b.status;
                document.getElementById('branchAddress').value = b.address;
                document.getElementById('branchLat').value = b.lat;
                document.getElementById('branchLng').value = b.lng;
            } else {
                document.getElementById('modalTitle').textContent = 'Yeni Şube Ekle';
            }
            document.getElementById('branchModal').classList.remove('hidden');
        }

        function closeBranchModal() { document.getElementById('branchModal').classList.add('hidden'); }

        function saveBranchForm(event) {
            event.preventDefault();
            const id = document.getElementById('branchId').value;
            const data = {
                id: id || 'custom-' + Date.now(),
                name: document.getElementById('branchName').value.trim(),
                city: document.getElementById('branchCity').value,
                district: document.getElementById('branchDistrict').value.trim(),
                status: document.getElementById('branchStatus').value,
                address: document.getElementById('branchAddress').value.trim(),
                lat: parseFloat(document.getElementById('branchLat').value),
                lng: parseFloat(document.getElementById('branchLng').value)
            };
            if (id) {
                const idx = branches.findIndex(b => b.id === id);
                if (idx !== -1) branches[idx] = data;
            } else {
                branches.unshift(data);
            }
            saveBranchesToStorage();
            renderBranches();
            closeBranchModal();
            showToast("Şube kaydedildi!", "success");
        }

        function confirmDeleteBranch(id) {
            document.getElementById('confirmTitle').textContent = 'Şubeyi Sil';
            document.getElementById('confirmMessage').textContent = 'Bu şubeyi silmek istediğinize emin misiniz?';
            document.getElementById('confirmActionBtn').onclick = function() {
                branches = branches.filter(b => b.id !== id);
                saveBranchesToStorage();
                renderBranches();
                closeConfirmModal();
                showToast("Şube silindi.", "info");
            };
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function confirmResetData() {
            document.getElementById('confirmTitle').textContent = 'Listeyi Sıfırla';
            document.getElementById('confirmMessage').textContent = 'Tüm özel eklemeler silinecek ve orijinal 163 şube listesine dönülecek?';
            document.getElementById('confirmActionBtn').onclick = function() {
                branches = JSON.parse(JSON.stringify(MASTER_BRANCHES));
                saveBranchesToStorage();
                renderBranches();
                closeConfirmModal();
                showToast("Orijinal liste yüklendi.", "success");
            };
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() { document.getElementById('confirmModal').classList.add('hidden'); }

        function toggleGpsTracking() {
            if (!navigator.geolocation) { showToast("Konum desteklenmiyor.", "error"); return; }
            if (isTrackingGps) {
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                isTrackingGps = false;
                watchId = null;
                userCoords = null;
                if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
                if (userAccuracyCircle) { map.removeLayer(userAccuracyCircle); userAccuracyCircle = null; }
                document.getElementById('gpsBtnText').textContent = "Konumumu Takip Et";
                document.getElementById('centerUserBtn').classList.add('hidden');
                renderBranches();
                showToast("GPS durduruldu.", "info");
            } else {
                isTrackingGps = true;
                document.getElementById('gpsBtnText').textContent = "Konum Aktif (Durdur)";
                document.getElementById('centerUserBtn').classList.remove('hidden');
                document.getElementById('centerUserBtn').classList.add('flex');
                let first = true;
                watchId = navigator.geolocation.watchPosition(pos => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    userCoords = { lat: latitude, lng: longitude };
                    if (!userMarker) {
                        const pulseIcon = L.divIcon({ className: 'user-pulse-icon', html: '<div class="user-location-pulse"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });
                        userMarker = L.marker([latitude, longitude], { icon: pulseIcon, zIndexOffset: 1000 }).addTo(map).bindPopup('Canlı Konumunuz');
                    } else { userMarker.setLatLng([latitude, longitude]); }
                    if (first) { map.flyTo([latitude, longitude], 14, { duration: 1.2 }); document.getElementById('sortOrder').value = 'distance'; first = false; }
                    renderBranches();
                }, err => showToast("GPS sinyali alınamadı.", "error"), { enableHighAccuracy: true });
                showToast("Konum takibi başlatıldı.", "success");
            }
        }

        function centerOnUser() {
            if (userCoords) map.flyTo([userCoords.lat, userCoords.lng], 15, { duration: 1 });
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bg = type === 'success' ? 'bg-emerald-950 text-emerald-50 border-emerald-700' : 'bg-slate-900 text-white border-slate-700';
            toast.className = `${bg} border px-4 py-2.5 rounded-2xl shadow-xl text-xs sm:text-sm font-medium flex items-center gap-2 transition-all duration-300`;
            toast.innerHTML = `<span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }
    </script>
</body>
</html>
